[project]
name = "sportsball"
version = "0.1.0"
description = "Tracks large events at Oracle Park and Chase Center, so SF residents can plan around the noise."
readme = "README.md"
license = "MIT"
authors = [
    { name = "Will Welch", email = "welch@quietplease.com" },
]
requires-python = ">=3.12"
dependencies = [
    "flask>=3.1.3",
    "google-cloud-logging>=3.15.0",
    "google-cloud-ndb>=2.4.2",
    "google-cloud-storage>=3.10.1",
    "gunicorn>=25.3.0",
    "pydantic>=2.13.3",
    "pyyaml>=6.0.3",
    "requests>=2.33.1",
]

[build-system]
requires = ["uv_build>=0.11.13,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # bugbear
    "UP",   # pyupgrade
    "SIM",  # simplify
    "RUF",  # ruff-specific
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ty.environment]
root = ["./src"]

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.12",
    "ty>=0.0.34",
]
